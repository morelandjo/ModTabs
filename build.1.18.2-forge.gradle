plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.18.2 targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client { client(); gameDirectory = file('run/') }
        server { server(); gameDirectory = file('run/'); programArgument('--nogui') }
    }
    mods {
        register(mod_id) { sourceSet(sourceSets.main) }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin: the Mixin annotation processor generates a refmap (Mojang → SRG) that's bundled
// into the jar so production builds can find their targets.
mixin {
    add sourceSets.main, 'modtabs.refmap.json'
    config 'modtabs.mixins.json'
}

repositories {
    // Integration-mod repositories (CurseMaven, Modrinth, ...) are re-added in later 1.18.2
    // port phases, together with per-mod 1.18.2 pins.
}

// =============================================================================
//  Integration mod dependencies (Forge 1.18.2)
// =============================================================================
// Phase 1 of the 1.18.2 port: scaffolding + config only. No integration mods yet —
// they are re-added per mod (with 1.18.2 Forge file pins) as each integration is ported.
//
// MidnightLib is NOT used on 1.18.2 (no 1.18.2 Forge build exists). The config is
// file-only via the in-tree vodmordia.modtabs.config.lib.MidnightConfig replacement.
// =============================================================================
dependencies {
    // Mixin AP writes the refmap; Mixin 0.8.5 is the version bundled with Forge 1.18.2.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

sourceSets.test.java.srcDir(rootProject.file('test-support/src/test/java'))
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.ow2.asm:asm:9.7.1'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    classpath += configurations.compileClasspath
    systemProperty 'modtabs.contracts', file('src/test/resources/integration-contracts.txt').absolutePath
    systemProperty 'modtabs.integrationEnum', file('src/main/java/vodmordia/modtabs/integration/ModIntegration.java').absolutePath
    systemProperty 'modtabs.screenClass', 'net.minecraft.client.gui.screens.Screen'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'modtabs.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
